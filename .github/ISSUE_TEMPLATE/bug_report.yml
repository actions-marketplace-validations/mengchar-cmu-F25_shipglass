name: Bug report
description: Report an archive comparison or report problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Please use synthetic examples. Do not attach private archives, credentials, or reports containing private paths. For vulnerabilities, see SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the exact command and a small synthetic example, if possible.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Shipglass version or commit, Python version, and operating system.
      placeholder: "Shipglass 0.1.0, Python 3.12, macOS 15"
    validations:
      required: true
